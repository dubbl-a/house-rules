name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm test
      - run: npm run check:traceability
      - run: bash tests/hooks/run.sh
      - run: node plugins/house/payload/check.mjs
      - run: bash tests/smoke-bootstrap.sh
      - name: Official validator (best-effort install, strict result)
        run: |
          if npm i -g @anthropic-ai/claude-code >/dev/null 2>&1; then
            claude plugin validate --strict ./plugins/house
          else
            echo "claude CLI unavailable in this runner; structure tests above are authoritative"
          fi
