name: harness-watch
on:
  schedule:
    # Hourly, offset off the top of the hour to dodge the cron stampede (see
    # pr-checks.yml's header note on the same choice). The check is one
    # changelog fetch, and the routine below fires once per new version, not
    # once per run, so a tighter cadence costs no extra routine runs.
    - cron: '17 * * * *'
  workflow_dispatch:
# Read-only: the job reads the changelog and this repo, remembers a fired
# version in the Actions cache, and calls the routine over HTTPS. It opens no
# issue; the routine's pull request is the record of a new version.
permissions:
  contents: read
concurrency:
  group: harness-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - name: Run the release check
        id: check
        run: |
          set +e
          node scripts/check-harness-release.mjs --json > harness-release.json
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "1" ]; then
            echo "latest=$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness-release.json','utf8')).latest)")" >> "$GITHUB_OUTPUT"
          fi
      # The cache entry is the memory of "already fired for this version", so the
      # routine runs once per version. A routine run that already pushed its branch
      # also counts, in case the cache entry was evicted.
      - name: Recall whether this version already fired
        if: steps.check.outputs.status == '1'
        id: fired
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: harness-fired
          key: harness-fired-${{ steps.check.outputs.latest }}
          lookup-only: true
      - name: Check for the routine's branch
        if: steps.check.outputs.status == '1' && steps.fired.outputs.cache-hit != 'true'
        id: branch
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          if git ls-remote --exit-code --heads origin "claude/harness-addendum-${LATEST}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The routine's URL and token come from its API trigger on claude.ai; with
      # either secret unset this step is skipped.
      - name: Fire the triage routine
        if: steps.check.outputs.status == '1' && steps.fired.outputs.cache-hit != 'true' && steps.branch.outputs.exists == 'false'
        id: fire
        env:
          ROUTINE_URL: ${{ secrets.HARNESS_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.HARNESS_ROUTINE_TOKEN }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          if [ -z "$ROUTINE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "routine secrets not set; Claude Code ${LATEST} found but no triage run started"
            exit 0
          fi
          curl -fsS -X POST "$ROUTINE_URL" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"version=${LATEST}\"}"
          mkdir -p harness-fired && echo "${LATEST}" > harness-fired/version
          echo "fired=true" >> "$GITHUB_OUTPUT"
      - name: Remember the fired version
        if: steps.fire.outputs.fired == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: harness-fired
          key: harness-fired-${{ steps.check.outputs.latest }}
      - name: Fail on a bad argument or unreadable source
        if: steps.check.outputs.status == '3'
        run: |
          echo "check-harness-release.mjs could not evaluate (exit 3); see the job log above"
          exit 1
