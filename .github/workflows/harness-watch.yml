name: harness-watch
on:
  schedule:
    # Offset off the top of the hour to dodge the cron stampede (see
    # pr-checks.yml's header note on the same choice).
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: harness-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - name: Run the release check
        id: check
        run: |
          set +e
          node scripts/check-harness-release.mjs --json > harness-release.json
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: File or update the issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SURVEYED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness-release.json','utf8')).surveyed)")
          LATEST=$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness-release.json','utf8')).latest)")
          NEWER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness-release.json','utf8')).newer.join(', '))")
          TITLE="Claude Code ${LATEST} shipped; last surveyed ${SURVEYED}"
          BODY=$(cat <<EOF
          Claude Code has shipped versions past the last one this repo surveyed.

          - Last surveyed: ${SURVEYED}
          - Newer versions (newest first): ${NEWER}
          - Changelog: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md

          Run the adapting-to-harness-updates skill in a local session.
          EOF
          )
          if ! gh label list --search harness-update --json name -q '.[].name' | grep -qx harness-update; then
            gh label create harness-update --description "Claude Code shipped past the last surveyed version" --color "5319E7"
          fi
          EXISTING=$(gh issue list --state open --label harness-update --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            OLD_TITLE=$(gh issue view "$EXISTING" --json title -q .title)
            [ "$OLD_TITLE" = "$TITLE" ] && exit 0
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            ISSUE="$EXISTING"
          else
            ISSUE=$(gh issue create --title "$TITLE" --body "$BODY" --label harness-update | sed 's#.*/##')
          fi
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
        id: issue
      # Fires the triage routine once per new version, not once per day: the step
      # above exits early when the open issue already names the latest version.
      # The routine's URL and token come from its API trigger on claude.ai; with
      # either secret unset this step is skipped.
      - name: Fire the triage routine
        if: steps.issue.outputs.issue != ''
        env:
          ROUTINE_URL: ${{ secrets.HARNESS_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.HARNESS_ROUTINE_TOKEN }}
          ISSUE: ${{ steps.issue.outputs.issue }}
        run: |
          if [ -z "$ROUTINE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "routine secrets not set; issue filed without a triage run"
            exit 0
          fi
          curl -fsS -X POST "$ROUTINE_URL" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"issue=${ISSUE}\"}"
      - name: Fail on a bad argument or unreadable source
        if: steps.check.outputs.status == '3'
        run: |
          echo "check-harness-release.mjs could not evaluate (exit 3); see the job log above"
          exit 1
