name: pr-checks
# Target wall time under one minute, so the feedback loop beats a local build.
#
# Deliberately NOT gated here (name what is excluded and why):
#   - anything needing a credential CI should not hold
#   - <add the repo's expensive local-only checks here>
#
# This repo's own copy, not the template: `npm test` and the hook tests run in
# ci.yml, sharded across parallel jobs (#363), so this workflow does not run
# them a second time. Here they added no coverage and, once ci.yml finished
# under a minute, would have been the slowest check on every PR. The template
# keeps both steps for adopters, which have no ci.yml beside it.
on:
  pull_request:
  workflow_dispatch:
  # Deliberately no `push:` trigger on the protected branch: pull_request
  # already covers every merge, and adding push would bill every commit twice.
permissions:
  contents: read # Read-only checkout; no comment/issue/PR mutation from this workflow.
concurrency:
  # A new push supersedes the run it's checking, so cancelling the stale run
  # is correct here. A job that must finish rather than restart mid-run (a
  # scheduled sync, a deploy) should set cancel-in-progress: false instead.
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      # Frozen install where a lockfile is committed; a plain install only
      # where there is none to hold it to. Never fall back from one to the
      # other: that fallback is the unfrozen install the lockfile exists to stop.
      # `npm ci` honours either lockfile npm writes, so both are named.
      - if: hashFiles('package-lock.json') != '' || hashFiles('npm-shrinkwrap.json') != ''
        run: npm ci --ignore-scripts
      - if: hashFiles('package-lock.json') == '' && hashFiles('npm-shrinkwrap.json') == ''
        run: npm install --ignore-scripts
      # `npm ci` accepts a stale nested lockfile entry a grouped bump left
      # behind; `npm ls` exits non-zero on `invalid` or `missing`.
      - if: hashFiles('package-lock.json') != '' || hashFiles('npm-shrinkwrap.json') != ''
        run: npm ls --all
      - run: node .house/check.mjs
      # If this repo commits a rendered artifact (a generated doc, a built
      # email, a snapshot), re-render it here and diff against what's
      # committed; a drift gate beats trusting the generator ran.
      - run: npm run check:snapshots --if-present
  # Content scan over full history: the fallback where the plan has no push
  # protection (a private repo on a personal account). Keep it on a plan that
  # has push protection too; it reads the same blobs with named key rules.
  # A known false positive is waived in .house/secret-allow with its reason.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # --history refuses a shallow clone
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: node scripts/house/scan-dist-secrets.mjs --history

# Need a scheduled workflow too (a sync job, a nightly report)? Offset the
# cron off the top of the hour (e.g. "17 * * * *") to dodge the stampede,
# set timeout-minutes, and give it a secrets-present guard step that fails
# loudly before any lane runs rather than partway through.
