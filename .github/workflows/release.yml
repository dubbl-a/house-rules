name: release
on:
  push:
    branches: [main]
  # A manual run syncs the adopters to an existing release, for a sync that was
  # held with the hold-sync label. It never releases.
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to sync the adopters to, X.Y.Z (the tag v<version> must exist)'
        required: true
        type: string
# Read-only by default. Only the release job writes contents in this repo (the
# tag and the GitHub release), and only the two note jobs write issues; the
# sync job writes to the adopters through the ADOPTER_SYNC_TOKEN secret, never
# through this repo's GITHUB_TOKEN. Release and sync share one workflow because
# a release made with GITHUB_TOKEN does not trigger another workflow.
permissions:
  contents: read
# One group per commit, so every push to main is evaluated: a single shared
# group keeps only the newest pending run and would drop a queued release
# behind a later push. Two runs that race on one version cannot both publish:
# the second fails at the tag push or at gh release create.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    # Only a push to main releases. A retry is "Re-run failed jobs" on that
    # push's run; a manual run only syncs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write pushes the vX.Y.Z tag and creates the GitHub release;
    # pull-requests: read lists the pull requests of the pushed commit.
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      hold: ${{ steps.hold.outputs.hold == 'true' }}
      unread: ${{ steps.hold.outputs.unread == 'true' }}
      released: ${{ steps.publish.outputs.released == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # A push to main whose version already has a GitHub release is not a
      # release: the job stops here and the sync job is skipped. Keying on the
      # release, not the tag, lets a rerun finish a run that tagged but failed
      # to publish. The job's released output is true only when the publish
      # step finished.
      - name: Read the plugin version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./plugins/house/.claude-plugin/plugin.json').version")
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "plugin.json version '${VERSION}' is not X.Y.Z; not releasing"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" --json tagName > /dev/null 2> "$RUNNER_TEMP/view.err"; then
            echo "v${VERSION} is already released; nothing to do"
            echo "released=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'release not found' "$RUNNER_TEMP/view.err"; then
            echo "v${VERSION} has no release; releasing"
            echo "released=pending" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/view.err"
            echo "could not look up the v${VERSION} release"
            exit 1
          fi
      # The notes are read before the tag is made, so a missing CHANGELOG
      # section fails the job without leaving a tag behind.
      - name: Extract the release notes
        if: steps.version.outputs.released == 'pending'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no '## [${VERSION}]' section with content; not releasing"
            exit 1
          fi
      # A squash merge pushes one commit to main, and the pull request that
      # merged as that commit carries the hold-sync label if the maintainer put
      # it there before merging. The step runs before the tag, so a lookup
      # that fails leaves nothing published and a rerun decides again.
      - name: Read the hold-sync label
        id: hold
        if: steps.version.outputs.released == 'pending'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Right after a merge the pulls list can still be empty, so an empty
          # answer is retried. A merged pull request that never turns up is
          # unread: the sync is held, never run on a guess.
          for TRY in 1 2 3; do
            PULLS=$(gh api "repos/${REPO}/commits/${GITHUB_SHA}/pulls")
            VERDICT=$(printf '%s' "$PULLS" | node scripts/release-hold.mjs "$GITHUB_SHA" hold-sync)
            echo "try ${TRY}: ${VERDICT}"
            if [ "$VERDICT" != unread ]; then break; fi
            if [ "$TRY" -lt 3 ]; then sleep 10; fi
          done
          echo "adopter sync: ${VERDICT}"
          case "$VERDICT" in
            hold) echo "hold=true" >> "$GITHUB_OUTPUT" ;;
            unread) echo "hold=true" >> "$GITHUB_OUTPUT"
                    echo "unread=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Tag and publish
        id: publish
        if: steps.version.outputs.released == 'pending'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null
          RC=$?
          set -e
          case "$RC" in
            0) echo "v${VERSION} is already tagged at $(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1); this run is ${GITHUB_SHA}; reusing the tag" ;;
            2) git tag -a "v${VERSION}" -m "Release ${VERSION}" "$GITHUB_SHA"
               git push origin "refs/tags/v${VERSION}" ;;
            *) echo "could not list the remote tags (exit ${RC})"
               exit 1 ;;
          esac
          # The Latest flag is explicit: a re-run of an older run must not take
          # Latest from a newer release, or the sync legs (which skip when
          # releases/latest is not their version) would sync the older one. A
          # failed fetch or an unreadable answer fails the step.
          RELEASES=$(gh api "repos/${REPO}/releases" --paginate --slurp)
          if ! LATEST=$(printf '%s' "$RELEASES" | node scripts/release-latest.mjs "$VERSION"); then
            echo "could not decide whether v${VERSION} is the latest release"
            exit 1
          fi
          echo "make v${VERSION} latest: ${LATEST}"
          gh release create "v${VERSION}" --verify-tag --latest="${LATEST}" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          echo "released=true" >> "$GITHUB_OUTPUT"
  # A held release leaves a note in the issue list, so it is not forgotten.
  hold-note:
    needs: release
    if: needs.release.outputs.released == 'true' && needs.release.outputs.hold == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Note the held sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          UNREAD: ${{ needs.release.outputs.unread }}
        run: |
          TITLE="Adopter sync held for v${VERSION}"
          {
            if [ "$UNREAD" = true ]; then
              echo "v${VERSION} is published, but the adopter sync was held because the merged release PR could not be found to read its hold-sync label. No adopter has v${VERSION}."
            else
              echo "v${VERSION} is published, but the adopter sync was held (the release PR carried the hold-sync label). No adopter has v${VERSION}."
            fi
            echo
            echo "A held sync can only be run while v${VERSION} is still the latest release; after the next release, that release's sync covers it and this issue can be closed."
            echo
            echo "To run the sync, from a checkout of this repo:"
            echo
            echo '```'
            echo "gh workflow run release.yml --ref main -f version=${VERSION}"
            echo '```'
            echo
            echo "Or use Actions, release, Run workflow, version ${VERSION}. A successful run closes this issue."
          } > "$RUNNER_TEMP/note.md"
          cat "$RUNNER_TEMP/note.md" >> "$GITHUB_STEP_SUMMARY"
          OPEN=$(gh issue list --repo "$REPO" --state open --search "\"${TITLE}\" in:title" --json title | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | length')
          if [ "$OPEN" != 0 ]; then
            echo "an issue titled '${TITLE}' is already open"
            exit 0
          fi
          gh issue create --repo "$REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/note.md"
  sync:
    needs: release
    # Push: sync after a release that was not held. Dispatch: sync the tag the
    # maintainer named, from main only, since this job holds the adopter token.
    # !cancelled() lets the job run past the release job, which a dispatch skips.
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.release.outputs.released == 'true' && needs.release.outputs.hold != 'true') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # adopter-preflight.yml mirrors this matrix; change both together.
        include:
          - { repo: aaron-gtm, branch: master, protect: '' }
          - { repo: aaron-personal, branch: main, protect: '' }
          - { repo: torrance-watch, branch: master, protect: torrance-city-meetings-data }
          - { repo: sb-takeover, branch: master, protect: '' }
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release.outputs.version }}
      REPO: dubbl-a/${{ matrix.repo }}
      BASE: ${{ matrix.branch }}
      PROTECT: ${{ matrix.protect }}
    steps:
      # A manual sync only goes to the latest release: render has no downgrade
      # guard, so syncing an older tag would roll every adopter back.
      - name: Check the version
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '${VERSION}' is not X.Y.Z; not syncing"
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
            if [ "v${VERSION}" != "$LATEST" ]; then
              echo "::error::v${VERSION} is not the latest release (${LATEST}); a manual sync of an older release would roll the adopters back. Not syncing"
              exit 1
            fi
          fi
      - name: Check for the sync token
        env:
          TOKEN: ${{ secrets.ADOPTER_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ADOPTER_SYNC_TOKEN is not set; ${REPO} not synced to ${VERSION}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ env.VERSION }}
          path: house-rules
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dubbl-a/${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          token: ${{ secrets.ADOPTER_SYNC_TOKEN }}
          path: adopter
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: house-rules/.nvmrc }
      # The sync branch exists before render, because render arms the adopter's
      # vendored .githooks floor, and the floor refuses commits on the default
      # branch.
      - name: Render and check
        working-directory: adopter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "chore/house-sync-${VERSION}"
          node ../house-rules/plugins/house/scripts/house render --repo . --apply
          set +e
          node .house/check.mjs > "$RUNNER_TEMP/check.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/check.txt"
          if ! grep -q '^Summary: 0 finding(s)' "$RUNNER_TEMP/check.txt"; then
            echo "::error::${REPO}: the checker reports findings after render; not syncing"
            exit 1
          fi
      # Render prints "update" for files it left unchanged, so the staged set is
      # what git sees as changed, path by path.
      - name: Commit the changed paths
        id: commit
        working-directory: adopter
        run: |
          { git diff --name-only -z; git ls-files --others --exclude-standard -z; } > "$RUNNER_TEMP/paths"
          if [ ! -s "$RUNNER_TEMP/paths" ]; then
            echo "${REPO} is already at ${VERSION}; nothing to sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PROTECT" ] && tr '\0' '\n' < "$RUNNER_TEMP/paths" | grep -Eq "^${PROTECT}(/|$)"; then
            echo "::error::${REPO}: render changed a path under ${PROTECT}/; not syncing"
            exit 1
          fi
          xargs -0 git add -- < "$RUNNER_TEMP/paths"
          git commit -m "chore: sync house-rules ${VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push and open the pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        working-directory: adopter
        env:
          GH_TOKEN: ${{ secrets.ADOPTER_SYNC_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          HEAD="chore/house-sync-${VERSION}"
          # The adopter token may not read this repo's releases, so the lookup
          # uses the workflow token. A failed lookup fails the step: no push on
          # a guess, and so does an empty tag. A stale leg sets no url, so the
          # wait step is skipped.
          LATEST=$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ -z "$LATEST" ]; then
            echo "::error::${REPO}: the latest release lookup returned no tag; not pushing"
            exit 1
          fi
          if [ "v${VERSION}" != "$LATEST" ]; then
            echo "::notice::${REPO}: v${VERSION} is no longer the latest release (${LATEST}); not syncing"
            exit 0
          fi
          git push --force origin "HEAD:refs/heads/${HEAD}"
          URL=$(gh pr list --repo "$REPO" --head "$HEAD" --state open --json url -q '.[0].url')
          if [ -z "$URL" ]; then
            URL=$(gh pr create --repo "$REPO" --base "$BASE" --head "$HEAD" \
              --title "chore: sync house-rules ${VERSION}" \
              --body "Re-render of the house-rules ${VERSION} payload by the house-rules release workflow. Merged automatically once every check passes.")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "pull request: $URL"
      # Merge only on all green. Every check on an adopter PR is a GitHub
      # Actions run, so this reads the workflow runs for the PR head commit, not
      # `gh pr checks`: a fine-grained token cannot read check runs (no Checks
      # permission). The token needs Actions: read here, besides Contents and
      # Pull requests read/write. "No runs" counts as green only in a repo with
      # no .github/workflows directory at the PR head; anywhere else it means
      # the runs have not registered yet, so keep waiting. A green poll is
      # confirmed by a second one on the same head, so a run that registers
      # late is seen.
      - name: Wait for checks, then merge
        if: steps.commit.outputs.changed == 'true' && steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.ADOPTER_SYNC_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -d adopter/.github/workflows ]; then HAS_WORKFLOWS=true; else HAS_WORKFLOWS=false; fi
          GREEN=0
          GREEN_SHA=
          RESULT=timeout
          for i in $(seq 1 40); do
            sleep 30
            set +e
            SHA=$(gh pr view "$URL" --repo "$REPO" --json headRefOid -q .headRefOid 2>&1)
            SHA_RC=$?
            OUT=
            API_RC=0
            if [ "$SHA_RC" -eq 0 ]; then
              OUT=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" 2>&1)
              API_RC=$?
            fi
            set -e
            if [ "$SHA_RC" -ne 0 ] || [ "$API_RC" -ne 0 ]; then
              echo "poll ${i}: could not read runs: ${SHA} ${OUT}"
              GREEN=0
              continue
            fi
            if ! STATE=$(printf '%s' "$OUT" | node house-rules/scripts/release-run-state.mjs); then
              echo "poll ${i}: could not read runs: $OUT"
              GREEN=0
              continue
            fi
            if [ "$STATE" = none ]; then
              if [ "$HAS_WORKFLOWS" = false ]; then
                echo "no runs and ${REPO} has no workflows; treating as no checks"
                GREEN_SHA="$SHA"
                RESULT=green
                break
              fi
              echo "poll ${i}: no runs registered yet"
              GREEN=0
              continue
            fi
            echo "poll ${i}: ${STATE}"
            if [ "$STATE" = fail ]; then
              printf '%s' "$OUT" | node -e '
                const r = JSON.parse(require("fs").readFileSync(0, "utf8")).workflow_runs;
                for (const x of r) console.log(`${x.name}: ${x.status} ${x.conclusion} ${x.html_url}`);
              '
              RESULT=fail
              break
            fi
            if [ "$STATE" = green ]; then
              if [ "$GREEN" -ge 1 ] && [ "$SHA" != "$GREEN_SHA" ]; then GREEN=0; fi
              GREEN_SHA="$SHA"
              GREEN=$((GREEN + 1))
              if [ "$GREEN" -ge 2 ]; then RESULT=green; break; fi
            else
              GREEN=0
            fi
          done
          if [ "$RESULT" != green ]; then
            echo "::error::${REPO}: checks ${RESULT}; leaving ${URL} open"
            exit 1
          fi
          # The wait can run long enough for a newer release to land; a newer
          # sync would then merge first, and this one must not overwrite it. The
          # pull request is closed with its branch, since an open one is a
          # rollback waiting for a click on merge; the newer release's sync
          # covers it. A failed close fails the leg, so no such pull request is
          # left open behind a green run. The residual window is the seconds
          # between this check and the merge below.
          LATEST=$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ -z "$LATEST" ]; then
            echo "::error::${REPO}: the latest release lookup returned no tag; leaving ${URL} unmerged"
            exit 1
          fi
          if [ "v${VERSION}" != "$LATEST" ]; then
            echo "::notice::${REPO}: v${VERSION} is no longer the latest release (${LATEST}); closing ${URL}, not merging"
            if ! gh pr close "$URL" --repo "$REPO" --delete-branch --comment "Superseded: ${LATEST} was released before this merged; that release's sync covers it."; then
              echo "::error::${REPO}: could not close ${URL}; close it by hand, it must not merge"
              exit 1
            fi
            exit 0
          fi
          # The head checked green is the only head that may merge.
          gh pr merge "$URL" --repo "$REPO" --squash --delete-branch --match-head-commit "$GREEN_SHA"
  # A manual sync that finished closes the note its hold left. Best effort: a
  # missing note is not an error.
  close-hold:
    needs: sync
    if: ${{ !cancelled() && needs.sync.result == 'success' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the held-sync note
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          TITLE="Adopter sync held for v${VERSION}"
          for N in $(gh issue list --repo "$REPO" --state open --search "\"${TITLE}\" in:title" --json number,title | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number'); do
            gh issue close "$N" --repo "$REPO" --comment "The manual sync run for v${VERSION} finished: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}. Legs skip when a newer release exists; see the run summary." || echo "could not close #${N}"
          done
