name: Question
description: Ask a question about adopting or using house-rules. Consider a Discussion first; most questions fit better there than an issue.
title: "[question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Discussions is usually the better fit for a question:
        https://github.com/dubbl-a/house-rules/discussions. Open an issue here only if you
        specifically want it tracked as one.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
