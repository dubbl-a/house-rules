# Dependabot: version updates only. Security updates are a separate repo
# setting (Settings > Code security > Dependabot) — leave it on; this file
# doesn't control it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      all-minor-and-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
      exclude: ["@anthropic-ai/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 3
